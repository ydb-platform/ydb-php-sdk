name: slo-report

# Fork PRs need the privileged base-repository publisher.
# No pull request code is checked out by this privileged publisher.
on:
  workflow_run:
    workflows: ["SLO"]
    types: [completed]

jobs:
  publish-slo-report:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    name: Publish YDB SLO Report
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Publish YDB SLO Report
        uses: ydb-platform/ydb-slo-action/report@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_workflows: SLO
          remove_label: SLO
