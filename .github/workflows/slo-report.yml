name: slo-report

# Reporting for pull requests from forks: their `pull_request` token is read-only,
# so the SLO workflow cannot publish the report itself. `workflow_run` runs in the
# base repository and has the permissions to do it.
#
# Everything else is reported by the SLO workflow directly, see slo.yml.
on:
  workflow_run:
    workflows: ["SLO"]
    types:
      - completed

jobs:
  publish-slo-report:
    runs-on: ubuntu-latest
    name: Publish YDB SLO Report
    permissions:
      checks: write
      contents: read
      pull-requests: write
    if: >-
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    steps:
      - name: Publish YDB SLO Report
        uses: ydb-platform/ydb-slo-action/report@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_run_id: ${{ github.event.workflow_run.id }}

  remove-slo-label:
    needs: publish-slo-report
    if: >-
      always() && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    name: Remove SLO Label
    permissions:
      pull-requests: write
    steps:
      - name: Remove SLO label from PR
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequests = context.payload.workflow_run.pull_requests;
            if (!pullRequests || pullRequests.length === 0) {
              console.log('No pull requests associated with this workflow run');
              return;
            }
            for (const pr of pullRequests) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: 'SLO'
                });
                console.log(`Removed SLO label from PR #${pr.number}`);
              } catch (error) {
                if (error.status === 404) {
                  console.log(`SLO label not found on PR #${pr.number}, skipping`);
                } else {
                  throw error;
                }
              }
            }
