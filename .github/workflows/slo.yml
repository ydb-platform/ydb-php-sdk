name: SLO

# SLO tests run the workload against a YDB cluster deployed by `ydb-slo-action`
# with chaos injection, and compare the current revision with a baseline one.
# They are opt-in: add the `SLO` label to a pull request or start them manually.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      github_issue:
        description: "Issue or pull request number for the SLO report comment"
        required: false
      baseline_ref:
        description: "Baseline commit/branch/tag to compare against (empty to auto-detect merge-base with main)"
        required: false
      slo_workload_duration_seconds:
        description: "Duration of the SLO workload in seconds"
        required: false
        default: "600"
      slo_workload_read_max_rps:
        description: "Maximum read RPS for the SLO workload"
        required: false
        default: "1000"
      slo_workload_write_max_rps:
        description: "Maximum write RPS for the SLO workload"
        required: false
        default: "100"

jobs:
  ydb-slo-action:
    # On `labeled` events run only when the `SLO` label itself was just added:
    # otherwise any unrelated label change on a PR that already carries `SLO`
    # would start a fresh run and cancel the in-progress one via `cancel-in-progress`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'SLO') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'SLO'))

    name: Run YDB SLO Tests
    runs-on: "large-runner-php-sdk"

    strategy:
      fail-fast: false
      matrix:
        sdk:
          - name: php-table

    concurrency:
      group: slo-${{ github.ref }}-${{ matrix.sdk.name }}
      cancel-in-progress: true

    steps:
      - name: Install dependencies
        run: |
          YQ_VERSION=v4.48.2
          BUILDX_VERSION=0.30.1
          COMPOSE_VERSION=2.40.3

          # The action reads its metrics configuration with yq.
          sudo curl -fLo /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

          sudo mkdir -p /usr/local/lib/docker/cli-plugins

          echo "Installing Docker Buildx ${BUILDX_VERSION}..."
          sudo curl -fLo /usr/local/lib/docker/cli-plugins/docker-buildx \
            "https://github.com/docker/buildx/releases/download/v${BUILDX_VERSION}/buildx-v${BUILDX_VERSION}.linux-amd64"
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx

          echo "Installing Docker Compose ${COMPOSE_VERSION}..."
          sudo curl -fLo /usr/local/lib/docker/cli-plugins/docker-compose \
            "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          echo "Installed versions:"
          docker --version
          docker buildx version
          docker compose version

      - name: Checkout current version
        uses: actions/checkout@v5
        with:
          path: current
          fetch-depth: 0

      - name: Determine baseline commit
        id: baseline
        working-directory: current
        run: |
          if [[ -n "${{ inputs.baseline_ref }}" ]]; then
            BASELINE="${{ inputs.baseline_ref }}"
          else
            BASELINE=$(git merge-base HEAD origin/main)
          fi
          echo "sha=$BASELINE" >> $GITHUB_OUTPUT

          if [ "$(git rev-parse origin/main)" = "$(git rev-parse $BASELINE)" ]; then
            BASELINE_REF="main"
          else
            BASELINE_REF="$(git rev-parse --short $BASELINE)"
          fi
          echo "ref=$BASELINE_REF" >> $GITHUB_OUTPUT

      - name: Checkout baseline version
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          path: baseline
          fetch-depth: 1

      - name: Stage shared workload harness
        run: |
          set -euxo pipefail
          # Share the checker, not the SDK sources or the built image.
          rm -rf "$GITHUB_WORKSPACE/baseline/slo-workload"
          cp -a "$GITHUB_WORKSPACE/current/slo-workload" "$GITHUB_WORKSPACE/baseline/slo-workload"

      - name: Build current workload image
        working-directory: current
        run: docker build --platform linux/amd64 -f slo-workload/Dockerfile -t ydb-app-current .

      - name: Build baseline workload image
        working-directory: baseline
        run: docker build --platform linux/amd64 -f slo-workload/Dockerfile -t ydb-app-baseline .

      - name: Run SLO Tests
        # Pin legacy telemetry fixes until ydb-slo-action#81 is merged.
        uses: ydb-platform/ydb-slo-action/init@d66bd1e10f893e5f70d542c4430a3cffb6d6f9f8
        timeout-minutes: 30
        with:
          github_issue: ${{ github.event.inputs.github_issue }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workload_name: ${{ matrix.sdk.name }}
          workload_duration: ${{ inputs.slo_workload_duration_seconds || '600' }}
          fail_on_workload_error: "true"
          workload_current_ref: ${{ github.head_ref || github.ref_name }}
          workload_current_image: ydb-app-current
          workload_current_command: >-
            -read-rps ${{ inputs.slo_workload_read_max_rps || '1000' }}
            -write-rps ${{ inputs.slo_workload_write_max_rps || '100' }}
          workload_baseline_ref: ${{ steps.baseline.outputs.ref }}
          workload_baseline_image: ydb-app-baseline
          workload_baseline_command: >-
            -read-rps ${{ inputs.slo_workload_read_max_rps || '1000' }}
            -write-rps ${{ inputs.slo_workload_write_max_rps || '100' }}
          workload_type: table

  # Build graph artifacts for every run. Same-repository PRs report directly;
  # fork PR comments belong to the privileged workflow_run publisher.
  publish-slo-report:
    needs: ydb-slo-action
    if: >-
      !cancelled() && needs.ydb-slo-action.result != 'skipped'

    name: Publish YDB SLO Report
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write

    steps:
      - name: Publish YDB SLO Report
        uses: ydb-platform/ydb-slo-action/report@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_run_id: ${{ github.run_id }}
          post_comment: >-
            ${{ github.event_name == 'workflow_dispatch' ||
                github.event.pull_request.head.repo.full_name == github.repository }}
          remove_label: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.head.repo.full_name == github.repository && 'SLO' || '' }}
