# SLO tests are opt-in: they need external infrastructure (k8s cluster, docker
# registry) configured via repository secrets. Run them manually or by adding
# the `SLO` label to a pull request, like the other YDB SDK repositories do.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

name: SLO

jobs:
  test-slo:
    concurrency:
      group: slo-${{ github.ref }}
      cancel-in-progress: true
    # On `labeled` events run only when the `SLO` label itself was just added:
    # otherwise any unrelated label change on a PR that already carries `SLO`
    # would start a fresh run and cancel the in-progress one via `cancel-in-progress`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'SLO') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'SLO'))

    runs-on: ubuntu-latest
    name: SLO test
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        if: env.DOCKER_REPO != null # check permissions
        env:
          DOCKER_REPO: ${{ secrets.SLO_DOCKER_REPO }}

      - name: Checkout SLO harness
        uses: actions/checkout@v4
        if: env.DOCKER_REPO != null
        env:
          DOCKER_REPO: ${{ secrets.SLO_DOCKER_REPO }}
        with:
          repository: ydb-platform/slo-tests
          ref: a3e5c8098e2930726d5f283038cd2ed54bcbceeb
          path: .slo-harness

      - name: Build final-error SLO harness
        if: env.DOCKER_REPO != null
        env:
          DOCKER_REPO: ${{ secrets.SLO_DOCKER_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          node -p 'JSON.parse(require("node:fs").readFileSync(".github/qa/slo-tests-final-error.patch.json", "utf8")).join("\n")' |
            git -C .slo-harness apply --index -
          test "$(git -C .slo-harness hash-object src/main.ts)" = "7af7db82daaca40ce44cf07d6241249a76e41436"
          test "$(git -C .slo-harness hash-object src/workload.ts)" = "95890d85ebfc99a37a023edfee6e23f275a14e29"
          test "$(git -C .slo-harness hash-object src/__tests__/workload.test.ts)" = "a05062527523e4f6ffe9192e85cfad92c94c0d32"
          cd .slo-harness
          npm ci
          npm run package

      - name: Run SLO
        uses: ./.slo-harness
        if: env.DOCKER_REPO != null # check permissions
        env:
          DOCKER_REPO: ${{ secrets.SLO_DOCKER_REPO }}
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KUBECONFIG_B64: ${{ secrets.SLO_KUBE_CONFIG }}
          AWS_CREDENTIALS_B64: ${{ secrets.SLO_AWS_CREDENTIALS }}
          AWS_CONFIG_B64: ${{ secrets.SLO_AWS_CONFIG }}
          DOCKER_USERNAME: ${{ secrets.SLO_DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.SLO_DOCKER_PASSWORD }}
          DOCKER_REPO: ${{ secrets.SLO_DOCKER_REPO }}
          DOCKER_FOLDER: ${{ secrets.SLO_DOCKER_FOLDER }}
          s3_endpoint: ${{ secrets.SLO_S3_ENDPOINT }}
          s3_images_folder: ${{ vars.SLO_S3_IMAGES_FOLDER }}
          grafana_domain: ${{ vars.SLO_GRAFANA_DOMAIN }}
          grafana_dashboard: dca60386-0d3d-43f5-a2af-5f3fd3e3b295
          grafana_dashboard_width: 2000
          grafana_dashboard_height: 2600
          ydb_version: 'newest'
          timeBetweenPhases: 30
          shutdownTime: 30

          language_id0: 'php'
          workload_path0: 'slo-workload'
          language0: 'php'
          workload_build_context0: ../.
          workload_build_options0: -f Dockerfile

      - uses: actions/upload-artifact@v4
        if: always() && env.DOCKER_REPO != null # check permissions and execute, even if the previous stage was failed
        env:
          DOCKER_REPO: ${{ secrets.SLO_DOCKER_REPO }}
        with:
          name: slo-logs
          path: logs/
