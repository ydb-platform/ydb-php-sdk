apiVersion: v1
kind: Service
metadata:
  name: database-sample-grpc
spec:
  ports:
    - port: 2135
      targetPort: 2135
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: database-sample-grpc
  labels:
    kubernetes.io/service-name: database-sample-grpc
addressType: IPv4
ports:
  - port: 2135
    protocol: TCP
endpoints:
  - addresses: ['${QA_HOST_IP}']
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-pushgateway
spec:
  ports:
    - port: 9091
      targetPort: 9091
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: prometheus-pushgateway
  labels:
    kubernetes.io/service-name: prometheus-pushgateway
addressType: IPv4
ports:
  - port: 9091
    protocol: TCP
endpoints:
  - addresses: ['${QA_HOST_IP}']
