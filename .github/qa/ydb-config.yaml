static_erasure: none
host_configs:
  - drive:
      - path: SectorMap:1:64
        type: SSD
    host_config_id: 1
hosts:
  - host: localhost
    host_config_id: 1
    node_id: 1
domains_config:
  domain:
    - name: root
      storage_pool_types:
        - kind: ssd
          pool_config:
            box_id: 1
            erasure_species: none
            kind: ssd
            pdisk_filter:
              - property:
                  - type: SSD
            vdisk_kind: Default
  state_storage:
    - ring:
        node: [1]
        nto_select: 1
      ssid: 1
blob_storage_config:
  service_set:
    groups:
      - erasure_species: none
        rings:
          - fail_domains:
              - vdisk_locations:
                  - node_id: 1
                    path: SectorMap:1:64
                    pdisk_category: SSD
channel_profile_config:
  profile:
    - channel:
        - erasure_species: none
          pdisk_category: 0
          storage_pool_kind: ssd
        - erasure_species: none
          pdisk_category: 0
          storage_pool_kind: ssd
        - erasure_species: none
          pdisk_category: 0
          storage_pool_kind: ssd
      profile_id: 0
table_service_config:
  sql_version: 1
grpc_config:
  port: 2134
